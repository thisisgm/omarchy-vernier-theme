# Vernier: solitude's geometry, measured and regularised.
#
# Every constant here was measured off /usr/share/omarchy/themes/solitude/colors.toml
# rather than chosen. What the measurement found in solitude, and what this file
# does about it:
#
#   - its surface ladder steps 0.019, 0.022 and 0.051 in OKLab lightness. Vernier
#     steps evenly, 0.0311 at a time.
#   - bright_foreground (L 0.746) sits darker than foreground (L 0.844), so the
#     emphasis ink is dimmer than the body ink. Vernier orders the ink ladder.
#   - cyan and bright_cyan are both #707070: one colour for two meanings. Across
#     the whole ring the tightest cross-meaning pair measures dE 0.0222, taking
#     the best of normal, protanopic, deuteranopic and tritanopic vision.
#   - six of its twelve ring colours fail WCAG AA against its own four surfaces.
#   - a diff is inverted: bright_green sits 0.290 DARKER than bright_red, so an
#     addition reads as the heavier line for every viewer.
#
# Three rules hold Vernier together:
#
#   1. One material. Every surface and every ink sits on OKLab hue 236.68,
#      the chroma-weighted mean hue of solitude's own twelve-colour slate ladder,
#      and carries the chroma its lightness earns from a least-squares fit of
#      solitude's chroma against lightness. Paper and ink are the same stone.
#   2. One voice. The brass accent is the only colour allowed to be loud, and it
#      means exactly one thing: this is what has focus. Its hue, 70.9, is not
#      invented either; it is the chroma-weighted mean hue of solitude's two warm
#      inks, #cbc2be and #c9c2b4.
#   3. Everything clears AA. All twelve ring colours clear 4.5:1 against all four
#      surfaces, which is what costs the ring its lightness range and is why it
#      is solved rather than picked.

mode = "dark"

# Brass. Focus, selection, active borders, nothing else. sRGB tops out at C 0.142
# on this hue at this lightness, and past about 0.10 the blue channel bottoms out
# and brass turns to mustard, so it is held at C 0.085.
accent = "#b38956"

selection = "#31363a"   # a surface, so no contrast floor applies
muted     = "#868d93"   # comments: the lowest rung that still clears AA on every surface

# Surface ladder. Even OKLab steps of 0.0311; depth comes from the step, not
# from shadows or borders. darker_background is byte-identical to solitude's.
darker_background  = "#080a0b"   # deepest: code blocks, lock screen
dark_background    = "#0e1112"   # chrome: bar, sidebars
background         = "#14181a"   # canvas: terminal, app bodies
lighter_background = "#1b1f21"   # raised: inputs, cards

# Ink ladder. Even OKLab steps of 0.061, ordered so emphasis is the lightest rung
# and dimmed the darkest, which is the ordering solitude inverts.
bright_foreground = "#dde0e2"   # emphasis
foreground        = "#c8ccd0"   # content ink
light_foreground  = "#b3b9bd"   # chrome ink
dark_foreground   = "#9fa6ab"   # secondary / dimmed

# ANSI ring at uniform C 0.105, with lightness and hue SOLVED for the largest
# worst-case separation across normal, protanopic, deuteranopic and tritanopic
# vision. Only the six base colours are solved; each bright variant is derived at
# +0.085 lightness with chroma eased 5 percent, so a family always separates by
# lightness. Solving all twelve independently produced green and bright_green at
# the same hex, which is the defect this theme exists to fix.
#
# Red is the one exemption: it carries 20 percent more chroma, because an error
# that fails to alarm has failed.
red     = "#e37d7d"
yellow  = "#b8ae5c"
green   = "#82c68e"
cyan    = "#27a6a2"
blue    = "#80a4e6"
magenta = "#ca8bc2"

# Bright ring: +0.085 lightness, chroma eased 5 percent. Emphasis, not neon.
bright_red     = "#ffa5a3"
bright_yellow  = "#dbd183"
bright_green   = "#abecb6"
bright_cyan    = "#5ecbc6"
bright_blue    = "#a8c7ff"
bright_magenta = "#ecaee3"

# The focused window is the only window wearing colour. Unfocused edges are felt
# rather than seen, sitting one surface rung above the canvas.
hyprland_active_border   = "rgba(b38956ee) rgba(c8ccd0ee)"
hyprland_inactive_border = "rgb(1b1f21)"
